name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      # Rebuilds interactive.html from the Python model, then: golden values and prose drift,
      # doubling-time envelope, physics-based floor, Python <-> JS parity.
      - run: ./run_tests.sh
        env:
          MPLBACKEND: Agg
